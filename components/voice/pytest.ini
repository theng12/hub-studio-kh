[pytest]
pythonpath = app
testpaths = app/tests
# These copied upstream tests exercise artifacts deliberately absent from the
# packaged backend: Pinokio launcher UI/scripts, launchd service/watchdog
# installation, and the source-tree Wave 1 qualification tool. The standalone
# worker covers runtime behavior through external-path and package identity tests.
addopts = --ignore=app/tests/test_launcher_menu.py --ignore=app/tests/test_service_startup_settings.py --ignore=app/tests/test_watchdog_resilience.py --ignore=app/tests/test_wave1_qualification.py
